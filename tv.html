<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F1A33">
<title>Telão · DISTR</title>
<link rel="icon" href="/logo-mark.png" type="image/png">
<!--
  TELÃO DA DISTRIBUIDORA (DISTR) — mesma estrutura do telão do E-commerce (Produtividade---E-commerce/tv.html).
  - Lê o MESMO banco do report da DISTR (Supabase qaehjplsasumuhszjcnu). Os dados continuam sendo
    abastecidos à mão no Admin › Abastecimento do report; o telão só lê e se atualiza sozinho.
  - Mesmas regras do report: start-inicial-calc.js (Start Inicial) e ressuprimento-calc.js (Ressuprimento).
  - A cada 1 min confere se chegou snapshot novo (só a data); quando chega, busca os dados e redesenha.
  - Dia mostrado: hoje; clicar na data embaixo do relógio (ou setas ↑/↓) escolhe outro dia e volta sozinho após 30 min.
  - Parâmetros na URL: ?giro=90 (segundos por tela) · ?refresh=60 (segundos entre conferências)
    · ?ressup=alocacao|retirada|soma (posição inicial do interruptor do Ressuprimento) · ?dia=aaaa-mm-dd
  - Não altera nada no banco.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="start-inicial-calc.js"></script>
<script src="ressuprimento-calc.js"></script>
<style>
html,body{margin:0;height:100%;background:#05080E;overflow:hidden}
*{box-sizing:border-box}
/* ---------- palco 1500×844 (16:9) escalado para qualquer TV ---------- */
#palco{position:absolute;left:50%;top:50%;width:1500px;height:844px;transform-origin:50% 50%;display:flex;flex-direction:column;
  --bg:#0F1623;--bg-card:#192032;--bg-input:#1E2A3D;--border:#253048;--text:#E8EBF2;--text-muted:#7C8BA8;--text-label:#9BAAC4;
  --cc:#297ADF;--cc2:#7FB2EC;--cc-t:#fff;
  --accent:#297ADF;--accent-light:#7FB2EC;--olive:#45C645;--amber:#F6BD00;--orange:#F5A524;--red:#C8102E;
  --gelo:#93A5B8;--laranja:#E8830D;--roxo:#A77BEA;--verde-escuro:#2E8B3E;--verde-musgo:#5B7F2B;--brand-miz:#DFBD41;
  background:var(--bg);color:var(--text);font-size:16px;line-height:1.35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden}

/* ---------- topo ---------- */
.fh{display:flex;align-items:center;gap:14px;padding:8px 22px;border-bottom:1px solid var(--border);flex:none}
.fh .lg{display:flex;align-items:center;gap:14px}.fh .lg img{height:46px;width:auto;display:block}.fh .lg small{color:var(--text-muted);font-weight:700;font-size:13px;letter-spacing:.12em;border-left:1px solid var(--border);padding-left:14px}
.fh .selo{font-size:20px;white-space:nowrap}
.fh .tt{flex:1;min-width:0;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden}
.fh .ck{white-space:nowrap}
.navt{display:inline-flex;align-items:center;gap:12px;vertical-align:middle}
.navt.so button{visibility:hidden}
#titulo{display:inline-block}
#titulo.troca{animation:tituloAvanca .55s cubic-bezier(.2,.8,.2,1)}#titulo.troca.recua{animation-name:tituloVolta}
@keyframes tituloAvanca{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes tituloVolta{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.navt button{width:34px;height:34px;border-radius:8px;border:1px solid color-mix(in srgb, var(--cc,#297ADF) 55%, transparent);background:color-mix(in srgb, var(--cc,#297ADF) 14%, transparent);color:var(--cc,#297ADF);font-family:inherit;font-size:20px;font-weight:800;line-height:1;padding:0 0 2px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .3s,border-color .3s,color .3s}
.navt button:hover{background:color-mix(in srgb, var(--cc,#297ADF) 30%, transparent);border-color:var(--cc,#297ADF)}
.fsb{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;cursor:pointer;background:rgba(127,140,170,.14);border:1px solid rgba(127,140,170,.35);color:inherit;font-family:inherit;font-size:12px;font-weight:600;line-height:1.2;white-space:nowrap}
.fsb:hover{background:rgba(127,140,170,.26)}
.fsb[hidden]{display:none}
body.ocioso,body.ocioso *{cursor:none!important}
.fh .lv{font-size:12px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:99px;padding:2px 10px;white-space:nowrap}
.fh .lv.passado{color:var(--amber);border-color:var(--amber)}
.fh .ck{text-align:right;font-size:12px;color:var(--text-muted);position:relative}.fh .ck #hora{font-size:24px;font-weight:700;color:var(--text)}
.fh .ck #data{cursor:pointer;display:inline-flex;align-items:center;gap:7px;margin-top:3px;padding:2px 10px;border:1px solid var(--border);border-radius:99px;color:var(--text-label);font-weight:600;text-transform:capitalize}
.fh .ck #data::after{content:"";border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--cc2)}
.fh .ck #data:hover,.fh .ck #data.aberto{border-color:var(--cc2);color:var(--text)}
/* Calendário do dia exibido: card escuro com os detalhes na cor da tela aberta */
.cal{position:absolute;right:0;top:calc(100% + 8px);z-index:60;width:304px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px 12px;text-align:left;box-shadow:0 14px 34px rgba(0,0,0,.5);font-family:"Segoe UI",Roboto,Arial,sans-serif}
.cal[hidden]{display:none}
.cal .kk{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--cc2)}
.cal .cab{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;padding-bottom:9px;border-bottom:1px solid var(--cc)}
.cal .mes{font-size:18px;font-weight:700;color:var(--text)}
.cal .nav{background:none;border:1px solid var(--border);color:var(--text-label);width:30px;height:30px;border-radius:6px;cursor:pointer;font:inherit;font-size:18px;line-height:1}
.cal .nav:hover:not(:disabled){border-color:var(--cc2);color:var(--cc2)}.cal .nav:disabled{opacity:.25;cursor:default}
.cal .grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .sm{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--text-muted);padding:2px 0 4px}
.cal .d{position:relative;height:34px;border-radius:6px;border:1px solid transparent;background:none;color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0}
.cal .d:hover:not(:disabled){background:var(--bg-input);border-color:var(--border)}
.cal .d:disabled{color:#38445C;cursor:default}
.cal .d.hoje{border-color:var(--cc);color:var(--cc2)}
.cal .d.sel{background:var(--cc);border-color:var(--cc);color:var(--cc-t);font-weight:800}
.cal .d.dado::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--cc2)}
.cal .d.sel.dado::after{background:var(--cc-t)}
.cal .rod{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted)}
.cal .rod i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--cc2);margin-right:6px;vertical-align:2px}
.cal .rod button{font:inherit;font-weight:700;font-size:12px;color:var(--cc2);background:none;border:1px solid var(--cc2);border-radius:99px;padding:4px 14px;cursor:pointer}
.cal .rod button:hover{background:var(--cc);color:var(--cc-t)}
/* interruptor do Ressuprimento: pequeno e meio translúcido na barra de cima (só aparece nessa tela) */
.chave{display:inline-flex;background:var(--bg-input);border:1px solid var(--border);border-radius:99px;padding:2px;gap:2px;opacity:.5;transition:opacity .3s}
.chave:hover{opacity:1}.chave[hidden]{display:none}
.chave button{font:inherit;font-size:11px;font-weight:700;color:var(--text-label);background:none;border:0;border-radius:99px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.chave button.on{background:var(--olive);color:#0E1626}
.chave button:not(.on):hover{color:var(--text)}
.main{flex:1;min-height:0;padding:12px 22px 0;display:flex;flex-direction:column;position:relative}
.tela{display:none;flex-direction:column;flex:1;min-height:0;gap:14px}.tela.on{display:flex;animation:telaEntra .7s cubic-bezier(.2,.8,.2,1) both}
.tela.saindo{animation:telaSai .35s ease-in both}
@keyframes telaEntra{from{opacity:0;transform:translateX(28px)}}
@keyframes telaSai{to{opacity:0;transform:translateX(-28px)}}
@media (prefers-reduced-motion:reduce){.tela.on,.tela.saindo{animation:none}}
.vazio{flex:1;display:grid;place-items:center;color:var(--text-muted);font-size:22px;text-align:center}

/* ---------- cards, painéis e top 5 (mesmos do telão do E-commerce) ---------- */
/* título sempre no alto do card; número e linha de baixo encostados embaixo */
.kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;display:grid;grid-template-rows:auto 1fr auto;gap:2px;border-top:4px solid var(--kc,var(--border));min-width:0;min-height:0;text-align:left}
.kpi .k{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:700}
/* título no alto, número centralizado na altura, linha de baixo encostada no canto inferior esquerdo */
.kpi .v{font-size:44px;font-weight:800;line-height:1;color:var(--vc,var(--text));white-space:nowrap;align-self:center}
.kpi .v .dt{margin-left:16px;font-size:34px;color:var(--amber)}
.kpi .v small{font-size:19px;font-weight:700;color:var(--text-muted);margin-left:8px}
.kpi .s{font-size:19px;color:var(--text-muted);white-space:nowrap;overflow:hidden;max-width:100%}.kpi .s b{color:var(--vc,var(--kc,var(--text)));font-weight:800}
.painel{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;display:grid;grid-template-rows:auto 1fr;gap:10px;min-height:0;min-width:0}
.painel .k{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--pc,var(--text-muted))}
.painel .k small{letter-spacing:0;text-transform:none;font-weight:600;color:var(--text-muted);font-size:13px}
.semhora{display:grid;place-items:center;color:var(--text-muted);font-size:18px;text-align:center}
.top5{display:grid;align-content:start;gap:6px}
.top5 div{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;font-size:18px;border-bottom:1px solid var(--border);padding-bottom:6px}
.top5 .p{font-weight:800;color:var(--text-muted)}.top5 b{font-size:20px}
.top5 .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- barras horizontais (funil) ---------- */
.etapas{display:grid;align-content:space-around;gap:6px;min-height:0}
.etapa{display:grid;grid-template-columns:320px 1fr 120px 90px;gap:16px;align-items:center}
.etapa .nm{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etapa .trilho{height:52px;background:var(--bg-input);border-radius:8px;overflow:hidden}
.etapa .barra{height:100%;border-radius:8px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.etapa .tot{text-align:right;font-size:26px;font-weight:800}
.etapa .tot.ped{color:var(--text-label);font-size:21px}
.etapa.cab .nm,.etapa.cab .tot{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--pc,var(--text-muted))}
.etapa.cab .tot{color:var(--text-muted)}
.etapa.total{border-top:1px solid var(--border);padding-top:8px}.etapa.total .nm{color:var(--text-label)}

/* ---------- colunas (FIFO e 7 dias) ---------- */
.colunas{position:relative;display:flex;align-items:flex-end;gap:14px;min-height:0;height:100%}
.col{flex:1;display:grid;grid-template-rows:1fr auto;gap:6px;height:100%;min-width:0}
.col .pilha{display:flex;flex-direction:column-reverse;justify-content:flex-start;align-self:end;position:relative;border-radius:6px 6px 0 0;overflow:visible;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.col .pilha i{display:block;min-height:2px}
.col .pilha i:last-child{border-radius:6px 6px 0 0}
.col .pilha em{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:4px;font-style:normal;font-weight:800;font-size:19px;white-space:nowrap;background:var(--bg-card);padding:0 5px;border-radius:4px;z-index:2}
.col .rot{text-align:center;font-size:15px;color:var(--text-label);white-space:nowrap}.col .rot small{display:block;font-size:13px;color:var(--text-muted)}
.media{position:absolute;left:0;right:0;border-top:2px dashed var(--text);z-index:1;pointer-events:none}
.leg-t{display:flex;gap:16px;font-size:14px;color:var(--text-label);text-transform:none;letter-spacing:0;font-weight:600}.leg-t i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- rosca ---------- */
.pizza{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;min-height:0}
.pizza svg{height:100%;max-height:150px;min-height:0;aspect-ratio:1}
.pizza .leg{display:grid;grid-template-columns:repeat(2,auto);column-gap:18px;row-gap:14px;align-content:center;justify-content:start;min-width:0}
.pizza .leg div{display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap;color:var(--text-label)}
.pizza .leg span{color:var(--text)}
.pizza .leg i{flex:none;width:12px;height:12px;border-radius:3px;background:var(--m)}.pizza .leg b{font-size:17px;color:var(--m)}

/* ---------- Start Inicial ---------- */
.si-topo{display:grid;grid-template-columns:1fr 1fr 1.45fr;gap:14px;height:150px;flex:none}
.si-meio{display:grid;grid-template-columns:2.5fr 1fr;gap:14px;flex:1;min-height:0}
/* NF × Segmento resumido: linhas = segmento, colunas = Sem NF / Com NF / Total */
.nfs{display:grid;align-content:space-around;gap:8px;min-height:0}
.nfs .lin{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:6px;align-items:center}
.nfs .cab span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--text-muted);text-align:center}
.nfs .cab span:first-child{text-align:left}
.nfs .seg{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nfs .c{text-align:center;border-radius:6px;padding:9px 2px;font-size:18px;font-weight:800;color:#0E1626}
.nfs .c.zero{background:transparent!important;color:var(--text-muted);font-weight:400}
.nfs .t{text-align:right;font-size:19px;font-weight:800}
.nfs .lin.total{border-top:1px solid var(--border);padding-top:8px}.nfs .lin.total .seg{color:var(--text-label)}
.nfs .lin.total .c{background:transparent;color:var(--text);font-size:19px}

/* ---------- Ressuprimento: cards de cima alinhados com os painéis de baixo ---------- */
.rs{display:grid;grid-template-columns:2.6fr 1.15fr;gap:14px;flex:1;min-height:0}
.rs-col{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
.rs-col .cresce{flex:1}
.rs-cards{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:14px;height:140px;flex:none}
.rs .kpi .v{font-size:38px}
.rs .painel.rosca{padding:12px 16px;gap:6px;height:240px;flex:none}
/* rosca grande à esquerda e a legenda numa coluna só à direita */
.rs .painel.rosca .pizza{grid-template-columns:auto 1fr;gap:22px;align-items:center}
.rs .painel.rosca .pizza svg{max-height:176px}
.rs .painel.rosca .pizza .leg{grid-template-columns:1fr;row-gap:12px;justify-content:start}
/* Top 5 por turno: três blocos empilhados, cada um na cor do turno */
/* rola de baixo para cima em loop contínuo (conteúdo duplicado, sobe metade da altura e recomeça) */
.tops{overflow:hidden;min-height:0;position:relative}
.tops .rolo{display:grid;gap:16px;padding-bottom:16px}
.tops .rolo.anda{animation:sobe var(--dur,30s) linear infinite}
@keyframes sobe{to{transform:translateY(-50%)}}
@media (prefers-reduced-motion:reduce){.tops .rolo.anda{animation:none}}
.tt5{display:grid;align-content:start;gap:8px}
.tt5 .tn{display:flex;justify-content:space-between;font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--t);border-bottom:2px solid var(--t);padding-bottom:3px}
.tt5 .tn em{font-style:normal;letter-spacing:0;font-weight:700}
/* linhas dos operadores: .top5 (mesmo desenho do telão do E-commerce) */
.tt5 .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt5 .sem{display:block;color:var(--text-muted);font-size:13px}

/* ---------- faixa de baixo em loop contínuo ---------- */
.loopbar{position:relative;overflow:hidden;background:#05080E;border-top:1px solid var(--border);height:46px;display:flex;align-items:center;flex:none;margin-top:12px}
.loopbar .giro{position:absolute;left:0;top:0;height:3px;width:100%;transform:scaleX(0);transform-origin:0 50%;background:var(--cc,var(--accent));z-index:1;will-change:transform}
.loopbar .giro[hidden]{display:none}
.loop{display:flex;width:max-content;animation:loopa var(--dur,55s) linear infinite}
.loop .g{display:flex;align-items:center;flex:none}
.ti{display:inline-flex;align-items:center;gap:8px;font-size:18px;white-space:nowrap;padding-right:34px;position:relative}
.ti::after{content:"";position:absolute;right:15px;top:50%;width:4px;height:4px;border-radius:50%;background:var(--text-muted)}
.ti i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.ti .v{color:var(--c,var(--accent-light));font-weight:800}
.ti b{color:var(--text-muted);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
@keyframes loopa{to{transform:translateX(-50%)}}
.selo{font-weight:700}.selo.ok{color:var(--olive)}.selo.atencao{color:var(--amber)}.selo.velho{color:var(--red)}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:none;place-items:center;background:#0F1623;z-index:50;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#E8EBF2}
#login.on{display:grid}
#login form{display:grid;gap:12px;width:min(360px,90vw);background:#192032;border:1px solid #253048;border-radius:12px;padding:26px}
#login h1{margin:0 0 6px;font-size:20px}#login p{margin:0;color:#7C8BA8;font-size:13px}
#login input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #253048;background:#1E2A3D;color:#E8EBF2}
#login button{font:inherit;font-weight:700;padding:10px;border-radius:8px;border:0;background:#297ADF;color:#fff;cursor:pointer}
#loginErro{color:#E0334F;font-size:13px;min-height:1em}
@media (prefers-reduced-motion:reduce){.loop{animation:none}}
</style>
</head>
<body>
<div id="palco">
  <div class="fh"><span class="lg"><img src="tv/logo-vulcabras-cor.png" alt="Vulcabras"><small>DISTRIBUIDORA</small></span><span class="tt"><span class="navt"><button type="button" id="telaAnt" aria-label="Tela anterior">&lt;</button><span id="titulo">Start Inicial</span><button type="button" id="telaProx" aria-label="Próxima tela">&gt;</button></span></span><div class="chave" id="chaveRessup" hidden></div><span class="selo" id="selo">Conectando…</span><button type="button" class="fsb" id="btnTelaCheia">⛶ Tela cheia</button><span class="lv" id="aoVivo">● AO VIVO</span><button type="button" class="fsb" id="btnHoje" title="Voltar para hoje" hidden>↺ Hoje</button><div class="ck"><div id="hora">--:--</div><span id="data" title="Escolher o dia mostrado" role="button" aria-haspopup="dialog"></span><div class="cal" id="cal" hidden role="dialog" aria-label="Dia exibido"></div></div></div>
  <div class="main">
    <section class="tela on" id="telaS" data-titulo="Start Inicial · PFAs em tela" data-giro="90" data-fonte="pfas"><div class="vazio">Carregando o Start Inicial…</div></section>
    <section class="tela" id="telaR" data-titulo="Ressuprimento" data-giro="90" data-fonte="ressuprimento_mov"><div class="vazio">Carregando o Ressuprimento…</div></section>
  </div>
  <div class="loopbar"><i class="giro" id="barra" hidden></i><div class="loop" id="loop"></div></div>
</div>
<div id="login"><form id="loginForm"><h1>Telão · DISTR</h1><p>Entre uma vez. A TV guarda o acesso.</p><input id="loginEmail" placeholder="Usuário ou e-mail" autocomplete="username" required><input id="loginSenha" type="password" placeholder="Senha" autocomplete="current-password" required><div id="loginErro"></div><button type="submit">Entrar</button></form></div>

<script>
(function(){
'use strict';
/* ================= CONFIGURAÇÃO ================= */
var Q = new URLSearchParams(location.search);
var GIRO_S = +Q.get('giro') || 90;          // segundos por tela
var REFRESH_S = +Q.get('refresh') || 60;    // segundos entre conferências de dado novo
var RECARREGA_H = 6;                        // recarga completa da página (pega versão nova, libera memória)
var RELE_TUDO_MIN = 30;                     // relê tudo de tempos em tempos, mesmo sem snapshot novo

/* ================= UTILITÁRIOS ================= */
function fmt(n){ n = Number(n); return isFinite(n) ? Math.round(n).toLocaleString('pt-BR') : '—'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var CONECTIVOS = ['DE','DA','DO','DAS','DOS','E'];
function nomeCurto(n){ var t = String(n||'').trim().split(/\s+/).filter(function(x){ return x && CONECTIVOS.indexOf(x.toUpperCase()) === -1; }); return t.length <= 1 ? n : t[0]+' '+t[t.length-1]; }
function nomeBonito(u){ return String(u||'').split(/[.\s]+/).filter(Boolean).map(function(x){ return x.charAt(0).toUpperCase()+x.slice(1).toLowerCase(); }).join(' '); }
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hojeISO(){ return isoLocal(new Date()); }
function somaDias(iso, n){ var p = iso.split('-'), d = new Date(+p[0], +p[1]-1, +p[2] + n); return isoLocal(d); }
function ddmm(iso){ return iso ? iso.slice(8,10)+'/'+iso.slice(5,7) : '—'; }
function rotDia(iso){ var p = iso.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]); return d.toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'2-digit' }); }
function cssVar(nome){ return 'var('+nome+')'; }
function qt(n){ return '<b>'+fmt(n)+'</b>'; }
// O número segue a cor da barra de destaque (kc) quando não vem cor própria (vc). un = unidade ao lado do número.
function kpiHtml(rot, valor, sub, kc, vc, un, extra){ vc = vc || kc; return '<div class="kpi" style="'+(kc?'--kc:'+kc+';':'')+(vc?'--vc:'+vc:'')+'"><span class="k">'+rot+'</span><span class="v">'+valor+(un?'<small>'+un+'</small>':'')+(extra||'')+'</span><span class="s">'+sub+'</span></div>'; }
function top5Html(lista, cor, vazio){
  if (!lista.length) return '<div class="semhora">'+vazio+'</div>';
  var INTENS = [1, .8, .62, .46, .32];   // intensidade da cor pela posição
  return '<div class="top5">'+lista.slice(0,5).map(function(x, i){ var st = ' style="color:'+cor+';opacity:'+INTENS[i]+'"';
    return '<div><span class="p"'+st+'>'+(i+1)+'</span><span class="nm">'+esc(x.nome ? nomeCurto(nomeBonito(x.nome)) : x.login)+'</span><b'+st+'>'+fmt(x.pecas)+'</b></div>'; }).join('')+'</div>';
}
// Linha de baixo dos cards numa linha só: se não couber, a fonte diminui até caber (mínimo 13 px).
function ajustaLinhaKpi(){ document.querySelectorAll('.kpi .s').forEach(function(el){ el.style.fontSize = ''; var f = 19; while (el.scrollWidth > el.clientWidth + 1 && f > 13) el.style.fontSize = (--f)+'px'; }); }
// Heatmap: do tom claro (pouco) à cor forte (muito).
function rgbDe(hex){ var n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function tomCalor(claro, forte, t){ var a = rgbDe(claro), b = rgbDe(forte); t = Math.max(0, Math.min(1, t || 0));
  return 'rgb('+a.map(function(x, i){ return Math.round(x + (b[i] - x)*t); }).join(',')+')'; }
function roscaHtml(itens, total, rotTotal){
  var R = 70, C = 2*Math.PI*R, acc = 0;
  var fatias = itens.map(function(x){
    var f = total ? x.v/total : 0, s = '<circle r="'+R+'" cx="90" cy="90" fill="none" stroke="'+x.cor+'" stroke-width="34" stroke-dasharray="'+(f*C).toFixed(1)+' '+C.toFixed(1)+'" stroke-dashoffset="'+(-acc*C).toFixed(1)+'" transform="rotate(-90 90 90)"/>';
    acc += f; return s;
  }).join('');
  // legenda em 2 colunas de 3 linhas, sem %: "■ Meia - 4.772" com a quantidade na cor do segmento
  var leg = itens.slice(0, 6).map(function(x){
    return '<div style="--m:'+x.cor+'"><i></i><span>'+esc(x.n)+'</span> - <b>'+fmt(x.v)+'</b></div>';
  }).join('');
  return '<div class="pizza"><svg viewBox="0 0 180 180">'+fatias+
    '<text x="90" y="94" text-anchor="middle" fill="#E8EBF2" font-size="28" font-weight="800">'+fmt(total)+'</text>'+
    '<text x="90" y="116" text-anchor="middle" fill="#7C8BA8" font-size="13">'+rotTotal+'</text></svg><div class="leg">'+leg+'</div></div>';
}
// mesmas cores do report DISTR (COR_SEGMENTO_COMP: Vestuário âmbar, Meia verde, Acessório azul-marinho, Calçado gelo; Sem família laranja)
var COR_SEGMENTO = { 'VESTUÁRIO':'#F6BD00', 'MEIA':'#45C645', 'ACESSÓRIO':'#2F5DA8', 'CALÇADO':'#93A5B8', 'SEM FAMÍLIA':'#E8830D' };
function segmentoTela(seg){ return seg === 'CHINELO' || seg === 'CHUTEIRA' ? 'CALÇADO' : (seg || 'SEM FAMÍLIA'); }
var COR_EXTRA = ['#93A5B8', '#EC4FA0', '#5B7F2B', '#2F5DA8'];
function corSegmento(seg, i){ return COR_SEGMENTO[seg] || COR_EXTRA[i % COR_EXTRA.length]; }
function corMaiorSegmento(lista){   // lista de { segmento, pares }: cor do segmento com mais peças
  var m = lista.reduce(function(a, x){ return !a || x.pares > a.pares ? x : a; }, null);
  return m && m.pares > 0 ? corSegmento(m.segmento, 0) : 'var(--border)';
}
function nomeSegmento(seg){ var s = String(seg||'').toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }

/* ================= FAIXA DE BAIXO EM LOOP CONTÍNUO ================= */
// Dois blocos iguais emendados = loop sem pausa; o bloco repete até passar da largura da janela (~110 px por segundo).
var faixaAtual = '';
function montaLoop(html){
  if (faixaAtual === html) return;   // mesmo conteúdo: não reinicia a animação
  faixaAtual = html;
  var el = document.getElementById('loop'), g = '<div class="g">'+html+'</div>';
  el.innerHTML = g + g;
  var bloco = el.firstChild;
  while (bloco.offsetWidth && bloco.offsetWidth < 1600) { bloco.innerHTML += bloco.innerHTML; el.lastChild.innerHTML = bloco.innerHTML; }
  el.style.setProperty('--dur', Math.max(10, Math.round(bloco.offsetWidth / 110)) + 's');
}

// NF × Segmento resumido: uma linha por segmento, colunas Sem NF / Com NF (cor de calor) e o total.
function nfSegmentoHtml(lista){
  var maior = 1, tSem = 0, tCom = 0;
  lista.forEach(function(s){ maior = Math.max(maior, s.sem, s.com); tSem += s.sem; tCom += s.com; });
  var cel = function(v){ return v ? '<span class="c" style="background:'+tomCalor('#CFE2F9', '#297ADF', Math.sqrt(v/maior))+'">'+fmt(v)+'</span>' : '<span class="c zero">·</span>'; };
  return '<div class="nfs"><div class="lin cab"><span>Segmento</span><span>Sem NF</span><span>Com NF</span><span style="text-align:right">Total</span></div>'+
    lista.map(function(s){ return '<div class="lin"><span class="seg">'+esc(s.rotulo)+'</span>'+cel(s.sem)+cel(s.com)+'<span class="t">'+fmt(s.sem + s.com)+'</span></div>'; }).join('')+
    '<div class="lin total"><span class="seg">Total</span><span class="c">'+fmt(tSem)+'</span><span class="c">'+fmt(tCom)+'</span><span class="t">'+fmt(tSem + tCom)+'</span></div></div>';
}

/* ================= TELA R · RESSUPRIMENTO ================= */
var COR_TURNO = { T01:'#297ADF', T02:'#DFBD41', T03:'#45C645' }, ORDEM_TURNO = ['T01','T02','T03'];
var COR_RS = '#45C645';
// Dias do Ressuprimento: os 10 últimos dias CORRIDOS até o dia exibido (hoje ou o escolhido no calendário);
// dia sem registro aparece zerado. Os cards mostram o último dia com registro.
function diasRessup(){
  if (!ressup) return { dias: [], comb: null, ult: null };
  var comb = RC.combinarEtapaRessup(etapaRessup, ressup.aloc, ressup.ret, [], []);
  var ate = diaTela(), porDia = {};
  RC.diasDoHistorico(comb.historico).forEach(function(d){ porDia[d.dia] = d; });
  var dias = [];
  for (var k = DIAS_RESSUP - 1; k >= 0; k--) { var d = somaDias(ate, -k); dias.push(porDia[d] || { dia:d, pecas:0, movimentos:0, turnos:{} }); }
  var ult = Object.keys(porDia).filter(function(d){ return d <= ate && porDia[d].pecas > 0; }).sort().pop();
  return { comb: comb, dias: dias, ult: ult ? porDia[ult] : null };
}
function desenhaChave(){
  var c = document.getElementById('chaveRessup');
  c.innerHTML = ['alocacao','retirada','geral'].map(function(k){
    return '<button type="button" data-etapa="'+k+'" class="'+(k === etapaRessup ? 'on' : '')+'">'+ROT_ETAPA_RESSUP[k]+'</button>'; }).join('');
}
function renderTelaR(){
  var el = document.getElementById('telaR');
  desenhaChave();
  if (!ressup) { el.dataset.vazia = '1'; el.innerHTML = '<div class="vazio">Sem Kardex de ressuprimento ainda.</div>'; return; }
  el.dataset.vazia = '';
  var x = diasRessup(), dias = x.dias, comb = x.comb, ult = x.ult;
  if (!ult) { el.innerHTML = '<div class="vazio">Sem registro de '+ROT_ETAPA_RESSUP[etapaRessup].toLowerCase()+' até '+ddmm(diaTela())+'.</div>'; return; }
  var diaU = ult.dia;
  var turnoCard = function(t){
    var y = ult.turnos[t] || { pecas:0, movimentos:0 };
    return kpiHtml(t, fmt(y.pecas), qt(y.movimentos)+' movimentos', COR_TURNO[t], null, 'peças');
  };
  // Rosca: segmentos do último dia, com Chinelo e Chuteira dentro de Calçados (igual ao report)
  var porSeg = {};
  comb.historico.forEach(function(h){ if (h.dia !== diaU) return; var sg = segmentoTela(h.segmento); porSeg[sg] = (porSeg[sg] || 0) + (h.pecas || 0); });
  var segs = Object.keys(porSeg).filter(function(k){ return porSeg[k] > 0; }).map(function(k){ return { segmento:k, pecas:porSeg[k] }; }).sort(function(a, b){ return b.pecas - a.pecas; });
  var itensRosca = segs.map(function(s, i){ return { n:nomeSegmento(s.segmento), v:s.pecas, cor:corSegmento(s.segmento, i) }; });
  // Barras dos 10 dias corridos empilhadas por turno; a média é dos dias com registro
  var comReg = dias.filter(function(d){ return d.pecas > 0; });
  var maxD = Math.max.apply(null, dias.map(function(d){ return d.pecas; }).concat(1)) * 1.12;
  var media = comReg.length ? Math.round(comReg.reduce(function(s, d){ return s + d.pecas; }, 0) / comReg.length) : 0;
  var cols = dias.map(function(d){
    var pedacos = ORDEM_TURNO.map(function(t){ var p = (d.turnos[t] || {}).pecas || 0; return p ? '<i style="flex:'+p+' 0 0;background:'+COR_TURNO[t]+'"></i>' : ''; }).join('');
    var p = d.dia.split('-'), sem = new Date(+p[0], +p[1]-1, +p[2]).toLocaleDateString('pt-BR', { weekday:'short' });
    return '<div class="col"><div class="pilha" style="height:'+(d.pecas/maxD*100).toFixed(1)+'%">'+(d.pecas ? '<em>'+fmt(d.pecas)+'</em>' : '')+pedacos+'</div>'+
      '<div class="rot"><small>'+esc(sem)+'</small>'+ddmm(d.dia)+'</div></div>';
  }).join('');
  var leg = '<span class="leg-t">'+ORDEM_TURNO.map(function(t){ return '<span><i style="background:'+COR_TURNO[t]+'"></i>'+t+'</span>'; }).join('')+
    '<span><i style="background:none;border-top:2px dashed var(--text);border-radius:0;height:0;width:18px;vertical-align:3px"></i>média '+fmt(media)+'/dia</span></span>';
  // Top 5 de cada turno no último dia em que o turno trabalhou (até o dia exibido), com a data à direita do turno
  var fontesOps = etapaRessup === 'retirada' ? [ressup.opsRet] : etapaRessup === 'geral' ? [ressup.opsAloc, ressup.opsRet] : [ressup.opsAloc];
  var tops = ORDEM_TURNO.map(function(t){
    var diasT = {};
    fontesOps.forEach(function(l){ (l || []).forEach(function(o){ if (RC.normalizarTurnoLegado(o.turno) === t && (+o.pecas || 0) > 0 && o.dia <= diaTela()) diasT[o.dia] = 1; }); });
    var diaT = Object.keys(diasT).sort().pop();
    var l = diaT ? RC.topOperadoresDia(etapaRessup, ressup.opsAloc, ressup.opsRet, diaT, 5, t) : [];
    // mesmo desenho do Top 5 do telão do E-commerce (top5Html): linha com divisória, cor do turno esmaecendo do 1º ao 5º
    var linhas = l.length ? '<div class="top5">'+l.map(function(o, i){ var st = ' style="color:'+COR_TURNO[t]+';opacity:'+[1, .8, .62, .46, .32][i]+'"';
      return '<div><span class="p"'+st+'>'+(i+1)+'</span><span class="nm">'+esc(o.nome ? nomeCurto(nomeBonito(o.nome)) : o.login)+'</span><b'+st+'>'+fmt(o.pecas)+'</b></div>'; }).join('')+'</div>' : '';
    return '<div class="tt5" style="--t:'+COR_TURNO[t]+'"><span class="tn">'+t+(diaT ? '<em>'+(diaT === hojeISO() ? 'hoje' : ddmm(diaT))+'</em>' : '')+'</span>'+(linhas || '<span class="sem">sem registro</span>')+'</div>';
  }).join('');
  el.innerHTML =
    '<div class="rs">'+
      '<div class="rs-col">'+
        '<div class="rs-cards">'+

          turnoCard('T01')+turnoCard('T02')+turnoCard('T03')+
        '</div>'+
        '<div class="painel cresce" style="--pc:'+COR_RS+'"><span class="k" style="display:flex;justify-content:space-between;align-items:center">'+
          '<span>Peças por dia e turno</span>'+leg+'</span>'+
          '<div class="colunas" style="padding-top:26px">'+cols+'<div class="media" data-frac="'+(media/maxD).toFixed(4)+'"></div></div></div>'+
      '</div>'+
      '<div class="rs-col">'+
        '<div class="painel rosca" style="border-top:4px solid '+corMaiorSegmento(segs.map(function(s){ return { segmento:s.segmento, pares:s.pecas }; }))+'"><span class="k">Por segmento · '+ddmm(diaU)+'</span>'+(itensRosca.length ? roscaHtml(itensRosca, ult.pecas, 'peças') : '<div class="semhora">Sem segmento no dia</div>')+'</div>'+
        '<div class="painel cresce" style="--pc:'+COR_RS+'"><span class="k">Top 5 por turno</span>'+

    '</div>';
  ajustaMediaColunas(el);

// Top 5 por turno rolando de baixo para cima em loop: duplica os blocos e anda ~24 px por segundo.
function ligaRolo(el){
  requestAnimationFrame(function(){
    var rolo = el.querySelector('.tops .rolo'); if (!rolo || rolo.classList.contains('anda')) return;
    if (!rolo.parentNode.clientHeight) return;   // tela escondida: liga quando ela entrar
    var altura = rolo.scrollHeight;
    rolo.innerHTML += rolo.innerHTML;
    rolo.style.setProperty('--dur', Math.max(12, Math.round(altura / 24)) + 's');
    rolo.classList.add('anda');
  });
}
// A linha da média fica na altura certa só medindo a área das barras (o rótulo do dia embaixo ocupa espaço).
function ajustaMediaColunas(el){
  requestAnimationFrame(function(){
    var area = el.querySelector('.colunas .media') && el.querySelector('.colunas .media').parentNode, m = area && area.querySelector('.media'), col = area && area.querySelector('.col');
    if (!m || !col || !col.clientHeight) return;   // tela escondida: mede quando ela entrar
    var rot = col.querySelector('.rot').offsetHeight + 6, pilhaArea = col.clientHeight - rot;
    m.style.bottom = (rot + pilhaArea * (+m.dataset.frac || 0)).toFixed(0) + 'px';
  });
}
function trocaEtapaRessup(k){
  if (k === etapaRessup || !ROT_ETAPA_RESSUP[k]) return;
  etapaRessup = k;
  try { localStorage.setItem('telao_distr_ressup', k); } catch(e) {}
  renderTelaR(); renderFaixa(); ajustaLinhaKpi();
}
document.getElementById('chaveRessup').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) { e.stopPropagation(); trocaEtapaRessup(b.dataset.etapa); } });

/* ================= FAIXA DE BAIXO (totais em loop) ================= */
function renderFaixa(){
  var itens = [], r = resumoSI, em = ehHoje() ? '' : ' em '+ddmm(diaTela());
  if (r && r.total.pfas) {
    itens.push('<span class="ti" style="--c:'+COR_PEND+'"><b>Material pendente'+em+'</b> <span class="v">'+fmt(r.pendente.pares)+'</span> peças</span>');
    // as duas etapas que ficam fora do Material pendente e do funil
    r.etapas.forEach(function(e){
      if (e.etapa === 'Nao disp. picking') itens.push('<span class="ti" style="--c:'+cssVar(e.cor)+'"><b>Não disp. picking</b> <span class="v">'+fmt(e.pares)+'</span> peças</span>');
      if (e.etapa === SI.ETAPA_LIDA) itens.push('<span class="ti" style="--c:'+cssVar(e.cor)+'"><b>Ag. embarque (lido na esteira)</b> <span class="v">'+fmt(e.pares)+'</span> peças</span>');
    });
    itens.push('<span class="ti" style="--c:'+COR_NF+'"><b>NF emitida · ag. coleta</b> <span class="v">'+fmt(r.nfAgColeta.pares)+'</span> peças</span>');
    if (r.maisAntiga) itens.push('<span class="ti" style="--c:'+COR_ANTIGA+'"><b>PFA mais antiga (NF)</b> <span class="v">'+fmt(r.maisAntiga.dias)+'</span> '+(r.maisAntiga.dias === 1 ? 'dia' : 'dias')+' · PFA '+esc(r.maisAntiga.pfa)+'</span>');
    itens.push('<span class="ti" style="--c:var(--accent-light)"><b>Total em tela</b> <span class="v">'+fmt(r.total.pares)+'</span> peças</span>');
    // total em tela por segmento (antes ficava numa faixa própria dentro da tela)
    var segF = {};
    r.segmentos.forEach(function(s){ var k = segmentoTela(s.segmento); segF[k] = (segF[k] || 0) + s.pares; });
    Object.keys(segF).sort(function(a, b){ return segF[b] - segF[a]; }).forEach(function(k, i){
      itens.push('<span class="ti" style="--c:'+corSegmento(k, i)+'"><i></i><b>'+esc(nomeSegmento(k))+' em tela</b> <span class="v">'+fmt(segF[k])+'</span> peças</span>');
    });
    if (r.ajustesEmAberto) itens.push('<span class="ti" style="--c:var(--accent-light)"><b>Ajustes de PFA em aberto</b> <span class="v">'+fmt(r.ajustesEmAberto)+'</span> ag. comercial</span>');
  }
  if (itens.length) montaLoop(itens.join(''));
}

/* ================= GIRO DAS TELAS ================= */
var telas = Array.prototype.slice.call(document.querySelectorAll('.tela')), atual = 0, inicioTela = Date.now();
function telasAtivas(){ return telas.filter(function(t){ return !t.dataset.vazia; }); }
function proximaTela(passo){ var n = telas.length; for (var k = 1; k <= n; k++){ var j = (atual + passo*k + n*k) % n; if (!telas[j].dataset.vazia) return j; } return atual; }
function giroDe(i){ return (Q.get('giro') ? GIRO_S : (+telas[i].getAttribute('data-giro') || GIRO_S)) * 1000; }
// Troca com transição: a tela atual esmaece (.saindo) e só então a próxima entra.
var trocaPendente = null;
function mostraTela(i){
  var velha = telas[atual];
  atual = i; inicioTela = Date.now();
  clearTimeout(trocaPendente);
  telas.forEach(function(t){ t.classList.remove('saindo'); });
  if (velha && velha !== telas[i] && velha.classList.contains('on') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    velha.classList.add('saindo');
    trocaPendente = setTimeout(function(){ velha.classList.remove('saindo'); entraTela(i); }, 350);
  } else entraTela(i);
}
// Cor de destaque de cada tela (barra do giro, setas e calendário): [forte, clara, texto sobre a forte]
var COR_TELA = { telaS:['#297ADF','#7FB2EC','#fff'], telaR:['#45C645','#9BE29B','#0E1626'] };
var sentidoTroca = 1;   // 1 = avançou (botão >, seta → ou rodízio), -1 = voltou (botão <, seta ←)
function entraTela(i){
  telas.forEach(function(t, k){ t.classList.toggle('on', k === i); });
  var cc = COR_TELA[telas[i].id] || COR_TELA.telaS, pal = document.getElementById('palco');
  pal.style.setProperty('--cc', cc[0]); pal.style.setProperty('--cc2', cc[1]); pal.style.setProperty('--cc-t', cc[2]);
  var tit = document.getElementById('titulo'), novoTit = telas[i].getAttribute('data-titulo');
  if (tit.textContent !== novoTit) { tit.textContent = novoTit; tit.classList.remove('troca', 'recua'); void tit.offsetWidth; tit.classList.add('troca'); if (sentidoTroca < 0) tit.classList.add('recua'); }
  sentidoTroca = 1;
  document.getElementById('chaveRessup').hidden = telas[i].id !== 'telaR' || !ressup;   // interruptor só na tela de Ressuprimento
  document.getElementById('barra').hidden = telasAtivas().length < 2;   // com uma tela só não há o que girar
  document.querySelector('.navt').classList.toggle('so', telasAtivas().length < 2);
  relogio();
  requestAnimationFrame(function(){   // tela estava escondida: só agora dá para medir
    ajustaLinhaKpi();
    if (telas[i].id === 'telaR') { ajustaMediaColunas(telas[i]); ligaRolo(telas[i]); }
  });
}
// Barra do giro redesenhada a cada quadro: anda contínua, sem pulos.
(function anima(){
  document.getElementById('barra').style.transform = 'scaleX(' + Math.min(1, (Date.now() - inicioTela) / giroDe(atual)) + ')';
  requestAnimationFrame(anima);
})();
setInterval(function(){
  if (telasAtivas().length > 1 && (Date.now() - inicioTela) >= giroDe(atual)) mostraTela(proximaTela(1));
}, 500);
['telaAnt', 'telaProx'].forEach(function(id, k){ document.getElementById(id).addEventListener('click', function(e){
  e.stopPropagation(); sentidoTroca = k ? 1 : -1; mostraTela(proximaTela(sentidoTroca)); }); });
document.addEventListener('keydown', function(e){   // para quem estiver ao lado da TV
  if (e.target && /input/i.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') mostraTela(proximaTela(1));
  if (e.key === 'ArrowLeft') { sentidoTroca = -1; mostraTela(proximaTela(-1)); }
  if (e.key === 'ArrowDown') escolheDia(somaDias(diaTela(), -1));   // dia anterior
  if (e.key === 'ArrowUp') escolheDia(somaDias(diaTela(), 1));      // dia seguinte (até hoje)
  var k = String(e.key).toLowerCase();   // interruptor do Ressuprimento: A = alocação, R = retirada, S = soma
  if (k === 'a') trocaEtapaRessup('alocacao');
  if (k === 'r') trocaEtapaRessup('retirada');
  if (k === 's') trocaEtapaRessup('geral');
});
// Calendário do dia exibido (no lugar do calendário nativo do Chrome, que não segue a identidade).
(function(){
  var cal = document.getElementById('cal'), lbl = document.getElementById('data'), mesCal = null;
  var MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  function iso(a, m, d){ return a+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  function desenha(){
    var hj = hojeISO(), sel = diaTela(), a = mesCal[0], m = mesCal[1];
    var ini = new Date(a, m, 1).getDay(), n = new Date(a, m+1, 0).getDate(), temProx = (m === 11 ? iso(a+1, 0, 1) : iso(a, m+1, 1)) <= hj;
    var h = '<div class="kk">Dia exibido</div><div class="cab"><button type="button" class="nav" data-mes="-1" aria-label="Mês anterior">‹</button>'+
      '<span class="mes">'+MESES[m]+' de '+a+'</span><button type="button" class="nav" data-mes="1" aria-label="Próximo mês"'+(temProx ? '' : ' disabled')+'>›</button></div>'+
      '<div class="grade">'+['D','S','T','Q','Q','S','S'].map(function(x){ return '<span class="sm">'+x+'</span>'; }).join('');
    for (var b = 0; b < ini; b++) h += '<span></span>';
    for (var d = 1; d <= n; d++) {
      var k = iso(a, m, d), cls = 'd'+(k === hj ? ' hoje' : '')+(k === sel ? ' sel' : '')+(diasComDado[k] ? ' dado' : '');
      h += '<button type="button" class="'+cls+'" data-dia="'+k+'"'+(k > hj ? ' disabled' : '')+'>'+d+'</button>';
    }
    cal.innerHTML = h + '</div><div class="rod"><span><i></i>dia com dado</span><button type="button" data-dia="'+hj+'">Hoje</button></div>';
  }
  function fecha(){ cal.hidden = true; lbl.classList.remove('aberto'); }
  lbl.addEventListener('click', function(e){
    e.stopPropagation();
    if (!cal.hidden) { fecha(); return; }
    var p = diaTela().split('-'); mesCal = [+p[0], +p[1]-1];
    desenha(); cal.hidden = false; lbl.classList.add('aberto');
  });
  cal.addEventListener('click', function(e){
    e.stopPropagation();
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.mes) { var m = mesCal[1] + (+b.dataset.mes); mesCal = [mesCal[0] + Math.floor(m/12), (m%12+12)%12]; desenha(); return; }
    if (b.dataset.dia) { escolheDia(b.dataset.dia === hojeISO() ? null : b.dataset.dia); fecha(); }
  });
  document.addEventListener('click', fecha);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') fecha(); });
  document.getElementById('btnHoje').addEventListener('click', function(e){ e.stopPropagation(); escolheDia(null); });
})();

/* ================= RELÓGIO, SELO E ESCALA ================= */
function relogio(){
  var d = new Date(), dia = diaTela(), passado = !ehHoje();
  document.getElementById('hora').textContent = d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  document.getElementById('data').textContent = rotDia(dia);
  var lv = document.getElementById('aoVivo');
  lv.textContent = passado ? '⚠ ' + ddmm(dia) : '● AO VIVO';
  lv.classList.toggle('passado', passado);
  document.getElementById('btnHoje').hidden = !passado;
  var s = document.getElementById('selo');
  var ultimoDado = atualizadoEm[telas[atual] ? telas[atual].getAttribute('data-fonte') : 'pfas'];
  if (!ultimoDado) return;
  var min = (Date.now() - ultimoDado.getTime()) / 60000, hh = ultimoDado.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  var dd = ultimoDado.toDateString() === d.toDateString() ? '' : ' de ' + ultimoDado.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
  s.textContent = '● Dado de ' + hh + dd + (falhou ? ' · sem conexão' : '');
  s.className = 'selo ' + (falhou ? 'velho' : passado ? 'atencao' : min > SELO_ATENCAO_MIN ? 'velho' : min > SELO_OK_MIN ? 'atencao' : 'ok');
}
setInterval(relogio, 15000); relogio();
// O palco tem 1500 px de base e estica na outra direção até preencher a janela inteira (TV 16:9, navegador, ultrawide).
function escala(){
  var k = Math.min(innerWidth/1500, innerHeight/844), palco = document.getElementById('palco');
  palco.style.width = (innerWidth/k)+'px'; palco.style.height = (innerHeight/k)+'px';
  palco.style.transform = 'translate(-50%,-50%) scale('+k+')';
}
/* ---------- tela cheia e cursor escondido ---------- */
function telaCheiaAtiva(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function atualizaBotaoTC(){ document.getElementById('btnTelaCheia').hidden = telaCheiaAtiva() || !(document.fullscreenEnabled || document.webkitFullscreenEnabled); }
document.getElementById('btnTelaCheia').addEventListener('click', function(e){
  e.stopPropagation();
  var el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
  if (f) { var p = f.call(el); if (p && p.catch) p.catch(function(){}); }
});
document.addEventListener('fullscreenchange', atualizaBotaoTC); document.addEventListener('webkitfullscreenchange', atualizaBotaoTC);
atualizaBotaoTC();
var ocioso = null;
function mexeu(){ document.body.classList.remove('ocioso'); clearTimeout(ocioso); ocioso = setTimeout(function(){ document.body.classList.add('ocioso'); }, 3000); }
document.addEventListener('mousemove', mexeu); mexeu();
var reRender = null;
addEventListener('resize', function(){ escala(); clearTimeout(reRender); reRender = setTimeout(function(){ faixaAtual = ''; renderTudo(); }, 300); }); escala();
setTimeout(function(){ location.reload(); }, RECARREGA_H*3600*1000);
// Versão nova publicada (deploy na Vercel): confere a cada 5 min e recarrega sozinho, sem precisar de F5.
(function(){
  var versao = null;
  function confere(){
    fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.ok ? r.text() : null; }).then(function(t){
      if (!t) return;
      if (versao === null) { versao = t; return; }
      if (t !== versao) location.reload();
    }).catch(function(){});
  }
  confere(); setInterval(confere, 5*60000);
})();
if (navigator.wakeLock) { var pedeWake = function(){ navigator.wakeLock.request('screen').catch(function(){}); }; pedeWake(); document.addEventListener('visibilitychange', function(){ if (!document.hidden) pedeWake(); }); }

/* ================= DADOS ================= */
// A cada REFRESH_S só confere a data do último snapshot de cada página; os dados pesados só vêm quando ela muda.
var versaoLida = {}, lidoEm = 0;
function inicioDoDiaSeguinte(iso){ var p = iso.split('-'); return new Date(+p[0], +p[1]-1, +p[2] + 1).toISOString(); }
async function ultimoGerado(pagina){
  var r = await sb.from('dashboard_snapshots').select('gerado_em').eq('pagina', pagina).order('gerado_em', { ascending:false }).limit(1);
  if (r.error) throw r.error;
  return r.data && r.data[0] ? r.data[0].gerado_em : null;
}
// Lê tudo de uma consulta em páginas de 1000 linhas (o Supabase devolve no máximo 1000 por vez).
async function lerTudo(montaConsulta){
  var todas = [];
  for (var de = 0; de < 50000; de += 1000) {
    var r = await montaConsulta().range(de, de + 999);
    if (r.error) return { error: r.error, data: todas };
    todas = todas.concat(r.data || []);
    if (!r.data || r.data.length < 1000) break;
  }
  return { data: todas };
}
async function carregaPfas(dia){
  // Hoje: o último snapshot. Dia passado: o último snapshot enviado até o fim daquele dia.
  var q = sb.from('dashboard_snapshots')
    .select('pendentes:payload->pendentes, aguardando_coleta:payload->aguardando_coleta, etapas:payload->etapas, faixas_fifo:payload->faixas_fifo, ajustes_em_aberto:payload->ajustes_em_aberto, conferencia_regra:payload->conferencia_regra, gerado_em')
    .eq('pagina', 'pfas');
  if (dia !== hojeISO()) q = q.lt('gerado_em', inicioDoDiaSeguinte(dia));
  var r = await Promise.all([
    q.order('gerado_em', { ascending:false }).limit(1),
    sb.from('dim_clientes_persona').select('nome, personalizavel'),
    // dias com snapshot de PFAs (pontinho do calendário)
    sb.from('dashboard_snapshots').select('gerado_em').eq('pagina', 'pfas').gte('gerado_em', new Date(Date.now() - 120*86400000).toISOString()).limit(1000),
  ]);
  if (r[0].error) throw r[0].error;
  (r[2].data || []).forEach(function(x){ diasComDado[isoLocal(new Date(x.gerado_em))] = 1; });
  var p = r[0].data && r[0].data[0];
  if (!p) { resumoSI = null; return; }
  // Lista de clientes que personalizam: a do banco; tabela vazia ou ilegível = lista padrão (igual ao report)
  var lista = !r[1].error && r[1].data && r[1].data.length ? r[1].data.map(function(c){ return { nome:c.nome, personalizavel:c.personalizavel }; }) : SI.listaPadraoPersona();
  SI.aplicarEtapaPersona(p, lista);
  // a idade da PFA mais antiga conta até o dia exibido
  var p2 = dia.split('-');
  resumoSI = SI.resumoStartInicial(p, dia === hojeISO() ? new Date() : new Date(+p2[0], +p2[1]-1, +p2[2], 12));
  atualizadoEm.pfas = new Date(p.gerado_em);
}
async function leOperadores(tabela, dia){
  var de = somaDias(dia, -10);
  var r = await lerTudo(function(){ return sb.from(tabela).select('dia, turno, login, nome, pecas, movimentos').gte('dia', de).lte('dia', dia).order('dia'); });
  if (r.error) r = await lerTudo(function(){ return sb.from(tabela).select('dia, turno, login, nome').gte('dia', de).lte('dia', dia).order('dia'); });   // banco sem migracao_operador_pecas.sql
  return r.error ? [] : (r.data || []);
}
async function carregaRessup(dia){
  var de = somaDias(dia, -40);
  var r = await Promise.all([
    lerTudo(function(){ return sb.from('ressuprimento_historico_diario').select('dia, segmento, turno, pecas, movimentos').gte('dia', de).lte('dia', dia).order('dia'); }),
    lerTudo(function(){ return sb.from('ressuprimento_retirada_diario').select('dia, segmento, turno, pecas, movimentos').gte('dia', de).lte('dia', dia).order('dia'); }),
    leOperadores('ressuprimento_operador_diario', dia),
    leOperadores('ressuprimento_retirada_operador', dia),
    sb.from('dashboard_snapshots').select('gerado_em').eq('pagina', 'ressuprimento_mov').order('gerado_em', { ascending:false }).limit(1),
  ]);
  if (r[0].error) throw r[0].error;
  var snap = !r[4].error && r[4].data && r[4].data[0];
  ressup = { aloc: r[0].data || [], ret: r[1].error ? [] : (r[1].data || []), opsAloc: r[2], opsRet: r[3] };
  ressup.aloc.concat(ressup.ret).forEach(function(h){ if (h.pecas > 0) diasComDado[h.dia] = 1; });
  if (snap) atualizadoEm.ressuprimento_mov = new Date(snap.gerado_em);
  if (!ressup.aloc.length && !ressup.ret.length) ressup = null;
}
function renderTudo(){
  renderTelaS(); renderTelaR(); renderFaixa(); ajustaLinhaKpi();
  document.getElementById('chaveRessup').hidden = telas[atual].id !== 'telaR' || !ressup;
  if (telas[atual].dataset.vazia && telasAtivas().length) mostraTela(proximaTela(1));
}
async function carregar(){
  try {
    var dia = diaTela();
    var g = await Promise.all([ultimoGerado('pfas'), ultimoGerado('ressuprimento_mov')]);
    var tudo = Date.now() - lidoEm > RELE_TUDO_MIN*60000 || versaoLida.dia !== dia, mudou = false;
    if (tudo || g[0] !== versaoLida.pfas) { await carregaPfas(dia); versaoLida.pfas = g[0]; mudou = true; }
    if (tudo || g[1] !== versaoLida.ressup) { await carregaRessup(dia); versaoLida.ressup = g[1]; mudou = true; }
    if (tudo) { lidoEm = Date.now(); versaoLida.dia = dia; }
    falhou = false;
    if (mudou) renderTudo();
  } catch(e) {
    console.error('Telão DISTR: falha ao buscar dados', e); falhou = true;   // mantém o último dado na tela, com o selo vermelho
  }
  relogio();
}

/* ================= LOGIN (uma vez; a TV guarda a sessão) ================= */
async function temPerfil(session){
  var r = await sb.from('perfis_acesso').select('role').eq('user_id', session.user.id).single();
  return !r.error && r.data;
}
async function iniciar(){
  var s = (await sb.auth.getSession()).data.session;
  if (!s || !(await temPerfil(s))) { document.getElementById('login').classList.add('on'); return; }
  document.getElementById('login').classList.remove('on');
  mostraTela(0);
  await carregar();
  setInterval(carregar, REFRESH_S*1000);
}
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var u = document.getElementById('loginEmail').value.trim().toLowerCase(), erro = document.getElementById('loginErro');
  erro.textContent = '';
  var r = await sb.auth.signInWithPassword({ email: u.indexOf('@') !== -1 ? u : u + DOMINIO_LOGIN, password: document.getElementById('loginSenha').value });
  if (r.error) { erro.textContent = 'Usuário ou senha inválidos.'; return; }
  if (!(await temPerfil(r.data.session))) { erro.textContent = 'Usuário sem perfil de acesso. Fale com o admin.'; await sb.auth.signOut(); return; }
  iniciar();
});
// Prévia sem banco (só para teste local): ?demo=1 desenha com dados de exemplo injetados pelo teste.
if (Q.get('demo') === '1' && window.TELAO_DEMO) {
  window.TELAO_DEMO(function(pfas, rs){
    SI.aplicarEtapaPersona(pfas, SI.listaPadraoPersona()); resumoSI = SI.resumoStartInicial(pfas); ressup = rs;
    rs.aloc.concat(rs.ret).forEach(function(h){ diasComDado[h.dia] = 1; });
    atualizadoEm.pfas = atualizadoEm.ressuprimento_mov = new Date(); mostraTela(0); renderTudo(); relogio();
  });
  return;
}
iniciar();
})();
